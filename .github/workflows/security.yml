name: Security Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  security-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: pip install --upgrade pip setuptools==83.0.0

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on installed packages
        run: pip-audit --local --progress-spinner off

  container-image:
    name: Build, test, and scan the Airflow image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the production image
        run: docker build --pull --tag jumia-scraper:${GITHUB_SHA} .

      - name: Verify Airflow and dbt environments and run scraper tests in the image
        env:
          IMAGE: jumia-scraper:${{ github.sha }}
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            "${IMAGE}" \
            -euo pipefail -c '
              export PYTHONDONTWRITEBYTECODE=1
              python -m pip check
              /opt/airflow/dbt-venv/bin/python -m pip check
              airflow version
              /opt/airflow/dbt-venv/bin/dbt --version
              python -m pytest -q -p no:cacheprovider tests
            '

      - name: Parse the dbt project in the built image
        env:
          IMAGE: jumia-scraper:${{ github.sha }}
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            "${IMAGE}" \
            -euo pipefail -c '
              mkdir -p /tmp/dbt-logs /tmp/dbt-target
              /opt/airflow/dbt-venv/bin/dbt parse \
                --project-dir /workspace/dbt \
                --profiles-dir /workspace/dbt \
                --target-path /tmp/dbt-target \
                --log-path /tmp/dbt-logs \
                --no-partial-parse
            '

      - name: Validate the Airflow DAG in the built image
        env:
          IMAGE: jumia-scraper:${{ github.sha }}
        run: |
          docker run --rm \
            --entrypoint python \
            -e PYTHONPATH=/workspace \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            "${IMAGE}" \
            .github/scripts/validate_pipeline.py

      - name: Export installed package lists from both image environments
        env:
          IMAGE: jumia-scraper:${{ github.sha }}
        run: |
          docker run --rm --entrypoint python "${IMAGE}" -m pip list --format=freeze > image-airflow-packages.txt
          docker run --rm --entrypoint /opt/airflow/dbt-venv/bin/python "${IMAGE}" -m pip list --format=freeze > image-dbt-packages.txt

      - name: Set up Python for auditing image package lists
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit the installed Airflow environment
        run: pip-audit --no-deps --requirement image-airflow-packages.txt --progress-spinner off

      - name: Audit the installed dbt environment
        run: pip-audit --no-deps --requirement image-dbt-packages.txt --progress-spinner off

      - name: Scan the built image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: jumia-scraper:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
